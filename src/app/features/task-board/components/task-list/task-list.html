<div class="task-list">
      @if (tasks.length === 0) {
        <div class="empty-state">
          <mat-icon>inbox</mat-icon>
          <p>No tasks here</p>
        </div>
      }
      @for (task of tasks; track task.id) {
        <app-task-card
          [task]="task"
          (complete)="complete.emit($event)"
          (delete)="delete.emit($event)"
        />
      }
    </div>
