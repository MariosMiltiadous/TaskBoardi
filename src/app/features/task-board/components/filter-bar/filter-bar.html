<mat-chip-listbox class="filter-bar" aria-label="Filter tasks">
  @for (option of options; track option) {
    <mat-chip-option [selected]="current === option" (click)="filterChange.emit(option)">
      <mat-icon matChipAvatar>{{ meta[option].icon }}</mat-icon>
      {{ meta[option].label }}
    </mat-chip-option>
  }
</mat-chip-listbox>
